function spark(k){
  const v=state.hist.map(h=>h[k]);if(v.length<2)v.push(v[0]);
  const W=96,H=28,p=3;let mn=Math.min(...v),mx=Math.max(...v);
  if(k==='ipca'){mn=Math.min(mn,1.5);mx=Math.max(mx,4.5)}
  if(mx-mn<1e-6){mx+=1;mn-=1}
  const X=i=>p+i*(W-2*p)/(v.length-1),Y=x=>H-p-(x-mn)/(mx-mn)*(H-2*p);
  const d=v.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1)).join(' ');
  const band=k==='ipca'?`<rect x="0" y="${Y(4.5).toFixed(1)}" width="${W}" height="${(Y(1.5)-Y(4.5)).toFixed(1)}" fill="var(--accent)" opacity=".12"/>`:'';
  const l=v.length-1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">${band}<path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-linejoin="round"/><circle cx="${X(l).toFixed(1)}" cy="${Y(v[l]).toFixed(1)}" r="2.6" fill="var(--accent)"/></svg>`;
}
function delta(k,good,dec,pct){
  const h=state.hist;if(h.length<2)return `<span class="d flat">início</span>`;
  const a=h[h.length-2][k],dv=state.ind[k]-a;
  if(pct){const p=dv/a*100;if(Math.abs(p)<.05)return `<span class="d flat">estável</span>`;return `<span class="d ${p>0?'up':'down'}">${p>0?'▲':'▼'} ${f(Math.abs(p))}%</span>`}
  if(Math.abs(dv)<Math.pow(10,-dec)/2)return `<span class="d flat">estável</span>`;
  return `<span class="d ${dv*good>0?'up':'down'}">${dv>0?'▲':'▼'} ${f(Math.abs(dv),dec)}</span>`;
}
function chip(k,v){
  if(k==='ipca')return v>4.5?'<span class="chip crit">acima do teto</span>':v<1.5?'<span class="chip warn">abaixo do piso</span>':'<span class="chip ok">na banda</span>';
  if(k==='prim')return v>=.25?'<span class="chip ok">meta cumprida</span>':v>=-.25?'<span class="chip warn">abaixo da meta</span>':'<span class="chip crit">déficit</span>';
  if(k==='div')return v>88?'<span class="chip crit">alerta</span>':v>84?'<span class="chip warn">subindo</span>':'';
  if(k==='cred')return v<30?'<span class="chip crit">baixa</span>':v>65?'<span class="chip ok">alta</span>':'';
  if(k==='cambio')return v>6?'<span class="chip crit">pressão</span>':'';
  if(k==='desemp')return v<6.2?'<span class="chip ok">mínima</span>':'';
  if(k==='ibov'){const m=Math.max(...state.hist.map(h=>h.ibov));return v>=m&&state.hist.length>1?'<span class="chip ok">recorde</span>':''}
  return '';
}
function renderPanel(){
  const I=state.ind;
  let h=IND.map(m=>`<div class="tile ${m.k==='ibov'?'wide':''}"><div class="lab"><span>${m.l}</span>${chip(m.k,I[m.k])}</div><div class="sub">${m.s}</div>
    <div class="row"><div><div class="val"><span class="odo" ${odoAttr(m.k,m.good)}>${m.v(I[m.k])}</span></div>${delta(m.k,m.good,m.d,m.pct)}</div>${spark(m.k)}</div></div>`).join('');
  h+=`<div class="approval" aria-label="Relações políticas">`+APROV.map(a=>{const v=I[a.k];const c=v<a.floor+8?'low':v<42?'mid':'';
    const danger=v<Math.max(25,a.floor+7);
    return `<div class="ap ${danger?'danger':''}"><div class="top"><b>${a.l}</b><span><span class="odo" ${odoAttr(a.k,1)}>${f(v,0)}%</span> ${delta(a.k,1,0)}</span></div>
    <div class="bar ${c}" style="--floor:${a.floor}%" role="meter" aria-valuenow="${Math.round(v)}" aria-valuemin="0" aria-valuemax="100" aria-label="${a.l}"><i style="width:${v}%"></i></div><p>${a.n}</p></div>`}).join('')+`</div>`;
  $('panel').innerHTML=h;
}
function optHint(op,seed){
  if(op.chance){const p=Math.round(op.chance(state.ind)*100);
    return `<div class="risk">Chance de aprovação ≈ ${p}%</div><div class="hint">Se passar: ${adviceFor(op.ok,seed)}</div>`}
  return `<div class="hint">${adviceFor(op.ef,seed)}</div>`;
}
/* Reação depois da escolha (sabatina): aqui as setas aparecem, como feedback */
function chips(ef){
  const arr=Object.entries(ef).map(([k,v])=>{const [l,g,sc]=FX[k];return {l,v,g,n:Math.abs(v)/sc}}).filter(x=>x.n>=.4).sort((a,b)=>b.n-a.n).slice(0,4);
  return arr.map(x=>`<span class="${x.v*x.g>0?'p':'n'}">${x.l} ${x.v>0?'▲':'▼'}</span>`).join('');
}

/* ---------- Hodômetro ---------- */
const FMT=Object.fromEntries([...IND.map(m=>[m.k,m.v]),...APROV.map(a=>[a.k,x=>f(x,0)+'%'])]);
let ANIM=false;
let ODO=null; // animação avulsa (Selic da 1ª reunião)
function odoAttr(k,good){
  if(ODO&&ODO.k===k)return `data-k="${k}" data-g="${good}" data-from="${ODO.from}" data-to="${ODO.to}"`;
  if(!ANIM||!state.report)return '';const P=state.report.prev;
  return `data-k="${k}" data-g="${good}" data-from="${P[k]}" data-to="${state.ind[k]}"`;
}
function runOdometers(){
  const els=[...document.querySelectorAll('.odo[data-from]')];if(!els.length)return;
  const T=REDUCE()?0:900,t0=performance.now();
  const frame=now=>{const p=Math.min(1,(now-t0)/(T||1)),e=1-Math.pow(1-p,3);
    for(const el of els){const a=+el.dataset.from,b=+el.dataset.to;el.textContent=FMT[el.dataset.k](a+(b-a)*e)}
    if(p<1)requestAnimationFrame(frame);
    else for(const el of els){const d=(+el.dataset.to-+el.dataset.from)*+el.dataset.g;
      if(Math.abs(+el.dataset.to-+el.dataset.from)>1e-3)el.classList.add(d>0?'flash-up':'flash-down');el.removeAttribute('data-from')}};
  requestAnimationFrame(frame);
}

  }else{
    h+=`<div class="projects">`+PROJ.map(P=>{const done=s.projDone.includes(P.id),cd=s.projCancel[P.id]!=null&&s.t-s.projCancel[P.id]<4,late=s.t+P.dur>16;
      return `<div class="proj ${done?'done':cd?'off':''}"><h3>${P.t}</h3><p>${P.d}</p>
       <div class="meta"><span>${P.dur} trimestres</span><span>${costTxt(P.custo)} por trimestre</span></div>

       ${done?'<span class="meta">Concluída</span>':cd?'<span class="meta">Arquivada recentemente. Volta à pauta em breve.</span>':late?'<span class="meta">Não termina antes do fim do mandato</span>':`<button type="button" class="btn" data-act="projstart" data-p="${P.id}">Iniciar</button>`}</div>`}).join('')+`</div>`;

/* ---------- Deck com swipe (Pointer Events: toque, mouse e caneta) ---------- */
function bindDeck(){
  const card=document.querySelector('.qcard.top');if(!card)return;
  let x0=0,y0=0,dx=0,drag=false,pid=null,t0=0;
  const reset=()=>{card.style.transform='';card.style.setProperty('--yes',0);card.style.setProperty('--no',0)};
  card.addEventListener('pointerdown',ev=>{if(ev.button>0)return;drag=true;pid=ev.pointerId;x0=ev.clientX;y0=ev.clientY;dx=0;t0=performance.now();
    try{card.setPointerCapture(pid)}catch(e){}card.classList.add('dragging')});
  card.addEventListener('pointermove',ev=>{if(!drag||ev.pointerId!==pid)return;dx=ev.clientX-x0;const dy=ev.clientY-y0;
    card.style.transform=`translate(${dx}px,${dy*.12}px) rotate(${dx/18}deg)`;
    card.style.setProperty('--yes',clamp(dx/110,0,1));card.style.setProperty('--no',clamp(-dx/110,0,1))});
  const end=ev=>{if(!drag)return;drag=false;card.classList.remove('dragging');
    const v=Math.abs(dx)/Math.max(1,performance.now()-t0);
    if(Math.abs(dx)>110||(Math.abs(dx)>45&&v>.6))swipe(dx>0?'yes':'no');else reset()};
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',()=>{drag=false;card.classList.remove('dragging');reset()});
  card.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight'){ev.preventDefault();swipe('yes')}if(ev.key==='ArrowLeft'){ev.preventDefault();swipe('no')}});
}
function swipe(dir){
  const card=document.querySelector('.qcard.top');if(!card||card.dataset.gone)return;card.dataset.gone='1';
  haptic('swipe');card.classList.add('fly');
  card.style.setProperty(dir==='yes'?'--yes':'--no',1);
  card.style.transform=`translate(${dir==='yes'?120:-120}vw,-3vh) rotate(${dir==='yes'?24:-24}deg)`;
  setTimeout(()=>{const s=state,k=s.deck[s.deckPos];
    if(dir==='yes'){s.quick=k;JUST='deck'}else s.deckPos++;
    $('quickzone').innerHTML=deckHTML();JUST=null;bindDeck();save();
    if(dir==='no')document.querySelector('.qcard.top')?.focus({preventScroll:true})},REDUCE()?0:280);
}

/* ---------- Notificações de plantão ---------- */
let pushShown=null,pushTimer=null,lastAckAt=Date.now();
function pumpPush(){
  const s=state;clearTimeout(pushTimer);
  if(s.phase!=='decidir'){hidePush();return}
  if(pushShown!=null)return;
  const i=s.evq.findIndex(q=>!q.ack);if(i<0)return;
  if($('sab')?.open){pushTimer=setTimeout(pumpPush,1500);return} // não interrompe a entrevista ao vivo
  const made=Object.keys(s.picks).length+Object.keys(s.vpicks).length;
  const delay=i===0?900:made>=2*i?700:Math.max(700,7000-(Date.now()-lastAckAt));
  pushTimer=setTimeout(()=>showPush(i),delay);
}
function showPush(i){
  const s=state;if(s.phase!=='decidir'||pushShown!=null)return;
  const q=s.evq[i];if(!q||q.ack)return;
  if(q.cp){pushShown=i;const c=q.cp,d=c.to-c.from,bp=f(Math.abs(d)*100,0);
    const el=document.createElement('button');el.type='button';el.className='push copomp';el.dataset.act='ack';
    el.innerHTML=`<span class="app" aria-hidden="true">%</span><span class="pbody"><span class="ph"><b>Copom</b><span>Banco Central · reunião de ${c.date}</span><time>agora</time></span>
      <strong>${d===0?`Copom mantém a Selic em ${f(c.to,2)}%`:d<0?`Copom corta ${bp} pontos-base: Selic a ${f(c.to,2)}%`:`Copom sobe ${bp} pontos-base: Selic a ${f(c.to,2)}%`}</strong>
      <span class="px">Primeira das duas reuniões do trimestre. A segunda acontece em ${copomDate(s.t,1)}.</span><em>Toque para confirmar</em></span>`;
    $('pushes').appendChild(el);requestAnimationFrame(()=>el.classList.add('in'));haptic('push',el);return}
  const ev=EVID[q.id],calm=CALM.has(q.id);pushShown=i;
  const el=document.createElement('button');el.type='button';el.className='push'+(calm?' calm':'');el.dataset.act='ack';
  el.innerHTML=`<span class="app" aria-hidden="true">MF</span><span class="pbody"><span class="ph"><b>${calm?'Boletim':'Urgente'}</b><span>Plantão Econômico · ${ev.c==='m'?'Mundo':'Brasil'}</span><time>agora</time></span>
    <strong>${esc(ev.t)}</strong><span class="px">${esc(ev.x)}</span><em>Toque para confirmar</em></span>`;
  $('pushes').appendChild(el);requestAnimationFrame(()=>el.classList.add('in'));
  haptic(calm?'calm':'push',el);
}
function ackPush(){
  const s=state,el=document.querySelector('.push');
  const q=pushShown!=null?s.evq[pushShown]:null;
  if(q){q.ack=true;if(q.cp&&!q.cp.applied){const from=s.ind.selic;applyMidCopom(s,q);ODO={k:'selic',from,to:s.ind.selic};renderPanel();runOdometers();ODO=null}}
  pushShown=null;lastAckAt=Date.now();haptic('ack');
  if(el){el.classList.remove('in');el.classList.add('out');setTimeout(()=>el.remove(),REDUCE()?0:260)}
  const p=$('plantao');if(p)p.innerHTML=plantaoHTML();
  refreshClose();save();pumpPush();
}
function hidePush(){clearTimeout(pushTimer);pushShown=null;const w=$('pushes');if(w)w.innerHTML=''}

function renderCopom(){
  const cp=state.copom,seen=cp.seen||0;
  const msgs=cp.msgs.map((m,i)=>{const nw=i>=seen,delay=nw?(i-seen)*.55:0;
    return `<div class="msg ${m.w}${nw?' new':''}" style="--d:${delay}s">${m.w==='bc'?avatar('pct','n'):''}<p>${esc(m.t)}</p></div>`}).join('');
  let foot='';

    const moved=cp.final!==cp.base;
    foot=`<div class="verdict new" style="--d:${(cp.msgs.length-seen)*.55}s"><span class="eyebrow">Comunicado do Copom</span>
      <div class="vline">Selic <span class="odo" data-k="selic" data-g="-1" data-from="${cp.from}" data-to="${cp.final}">${f(cp.from,2)}%</span></div>
      <p>${moved?'Decisão por 5 votos a 4.':'Decisão unânime.'} ${cp.final<cp.from?'Corte':cp.final>cp.from?'Alta':'Manutenção'} ${cp.final!==cp.from?`de ${f(Math.abs(cp.final-cp.from)*100,0)} pontos-base`:'da taxa'}.</p>
      ${cp.leaked?'<div class="leak"><b>Vazou.</b> Um jornal publicou detalhes da conversa minutos depois do comunicado.</div>':cp.choice!=='respect'?'<div class="leak safe">A conversa ficou entre vocês. Por enquanto.</div>':''}
      <button class="btn" type="button" data-act="copomdone">Ver o relatório do trimestre</button></div>`;
  }else foot=`<div class="replies new" style="--d:${(cp.msgs.length-seen)*.55}s" role="group" aria-label="Sua resposta">${COPOM_OPTS[cp.step].map(o=>`<button type="button" class="reply" data-act="copom" data-k="${o.k}">${esc(o.t)}</button>`).join('')}</div>`;
  $('main').innerHTML=`<section class="copom-room"><header>${avatar('pct','n',true)}<div><span class="eyebrow">Reunião reservada · Banco Central · véspera do Copom de ${copomDate(state.t,1)}</span><h2>Antes do Copom</h2>

   <div class="card col"><h4>Imprensa especializada</h4>${b.colunas.map(c=>`<div class="post"><blockquote>${esc(c.q)}</blockquote><div class="by"><b>${c.a[0]}</b>, ${c.a[1]}</div></div>`).join('')}</div>
   <div class="card pop"><h4>Imprensa geral</h4>${b.pops.map(p=>`<div class="post"><div class="src">${p.s}</div><div class="hl">${esc(p.h)}</div><p>${esc(p.p)}</p></div>`).join('')}</div></div>`;

function copomText(cp){
  const dS=cp.d-cp.a,m=cp.mid;
  const midTxt=m?(m.to===m.from?`Em ${m.date}, manteve a Selic em ${f(m.to,2)}%.`:`Em ${m.date}, ${m.to<m.from?'cortou':'subiu'} ${f(Math.abs(m.to-m.from)*100,0)} pontos-base, para ${f(m.to,2)}%.`):'';
  const head=dS===0?`Copom mantém a Selic em ${f(cp.d,2)}%`:dS>0?`Copom eleva a Selic em ${f(dS*100,0)} pontos-base, para ${f(cp.d,2)}%`:`Copom corta a Selic em ${f(-dS*100,0)} pontos-base, para ${f(cp.d,2)}%`;
  let why;
  if(cp.interactive){
    why=cp.choice==='respect'?'Você não interferiu na decisão.':cp.choice==='offer'?(cp.won?'Sua contrapartida fiscal convenceu o comitê a ir 25 pontos-base além.':'Sua contrapartida fiscal não mudou o voto do comitê.')
      :cp.d>cp.base?'O recado político saiu pela culatra: o comitê endureceu para mostrar independência.':cp.d<cp.base?'O comitê cortou um pouco mais e fez questão de dizer que foi pelos dados.':'O comitê ignorou o recado político.';
    if(cp.leaked)why+=' A conversa vazou para a imprensa.';
  }else why=dS>0?'O comitê cita expectativas desancoradas e risco fiscal.':dS<0?'O comitê vê a inflação convergindo e reconhece o compromisso fiscal.':'O comitê pede cautela diante das incertezas domésticas e externas.';
  return {head:(cp.date?`${cp.date}: `:'')+head,why,midTxt};
}

/* ---------- Fim de jogo ---------- */
function grades(){
  const h=state.hist,I=state.ind,avg=h.slice(1).reduce((a,x)=>a+x.pib,0)/Math.max(1,h.length-1);
  return [
   ['Crescimento',clamp(5+2.5*(avg-2),0,10),`média de ${sgn(avg)}%`],
   ['Inflação',clamp(10-3*Math.abs(I.ipca-3),0,10),`IPCA final ${f(I.ipca)}%`],
   ['Contas públicas',clamp(5+5*I.prim,0,10),`primário ${sgn(I.prim)}%`],
   ['Dívida',clamp(6-.6*(I.div-82.5),0,10),`DBGG ${f(I.div)}%`],
   ['Emprego',clamp(5+2*(6.5-I.desemp),0,10),`desemprego ${f(I.desemp)}%`],
   ['Aprovação',clamp(I.povo/6,0,10),`${f(I.povo,0)}% de apoio`],
   ['Planalto',clamp(I.pres/8,0,10),`relação em ${f(I.pres,0)}%`],
   ['Congresso',clamp(I.cong/6,0,10),`apoio de ${f(I.cong,0)}%`],
  ];
}
function renderEnd(){
  const s=state,g=grades(),m=g.reduce((a,x)=>a+x[1],0)/g.length,demit=s.over?.kind==='demitido';
  let t;
  if(demit)t=s.over.t;else if(m>=7.5)t='Ministro histórico';else if(m>=6)t='Gestão sólida';else if(m>=4.5)t='Mandato morno';else t='Herança pesada';
  const rep=s.report&&s.report.buzz?`<div class="sec"><h2>A última repercussão</h2></div>${renderBuzz(s.report.buzz)}`:'';

async function offerFile(filename,blob){
  if(DL){try{await DL.save({filename,data:blob});return 'saved'}catch(e){if(e&&e.code==='declined')return 'declined'}}
  try{const file=new File([blob],filename,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return 'shared'}}
  catch(e){if(e&&e.name==='AbortError')return 'declined'}
  if(!FRAMED){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return 'downloaded'}
  return 'unavailable';
}

/* Cartão 1080×1920 para Stories, desenhado em canvas com paleta fixa */
async function drawCard(s){
  try{await Promise.all(['800 120px Archivo','600 60px Archivo','500 30px "IBM Plex Mono"','400 40px "IBM Plex Sans"'].map(x=>document.fonts.load(x)))}catch(e){}
  const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const P={bg:'#0D1D18',ink:'#EEF3EF',muted:'#93A59C',acc:'#3DB397',och:'#E1A54C',bad:'#F07A6E',line:'#24382F'};
  const D='Archivo, "Arial Narrow", sans-serif',M='"IBM Plex Mono", ui-monospace, monospace',S='"IBM Plex Sans", system-ui, sans-serif';
  const font=(w,sz,fam,cond)=>{x.font=`${w} ${sz}px ${fam}`;if('fontStretch' in x)x.fontStretch=cond?'condensed':'normal'};
  /* reduz o corpo até o texto caber na largura (fontes de reserva são mais largas) */
  const fit=(w,sz,fam,t,maxW,cond=1)=>{font(w,sz,fam,cond);while(sz>24&&x.measureText(t).width>maxW){sz-=4;font(w,sz,fam,cond)}return sz};
  const wrap=(t,maxW)=>{const out=[];let l='';for(const w of t.split(' ')){const tr=l?l+' '+w:w;if(x.measureText(tr).width>maxW&&l){out.push(l);l=w}else l=tr}if(l)out.push(l);return out};
  x.fillStyle=P.bg;x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.16;x.strokeStyle=P.acc;x.lineWidth=2;for(let r=30;r<620;r+=18){x.beginPath();x.arc(W-60,180,r,0,Math.PI*2);x.stroke()}
  x.strokeStyle=P.och;x.lineWidth=1.5;for(let r=40;r<520;r+=26){x.beginPath();x.arc(W-260,420,r,0,Math.PI*2);x.stroke()}x.restore();
  const L=90;let y=150;x.textBaseline='alphabetic';
  font(500,30,M);x.fillStyle=P.och;x.fillText('SIMULADOR DE MINISTRO DA FAZENDA · 2027–2030',L,y);
  const ts=fit(800,150,D,'O pior emprego',W-2*L);y+=ts;x.fillStyle=P.ink;x.fillText('O pior emprego',L,y);y+=ts;x.fillStyle=P.acc;x.fillText('do mundo',L,y);
  y+=70;x.fillStyle=P.line;x.fillRect(L,y,W-2*L,3);
  const {g,m}=finalScore(s),demit=s.over?.kind==='demitido';
  y+=90;font(500,30,M);x.fillStyle=P.muted;x.fillText(demit?`SAÍDA ANTECIPADA · ${s.t} TRIMESTRE${s.t>1?'S':''}`:'MANDATO COMPLETO',L,y);
  y+=95;fit(600,84,D,s.nome,W-2*L);x.fillStyle=P.ink;x.fillText(s.nome,L,y);y+=88;
  y+=20;font(800,96,D,1);x.fillStyle=demit?P.bad:P.och;for(const ln of wrap(verdict(s,m),W-2*L).slice(0,2)){fit(800,96,D,ln,W-2*L);x.fillText(ln,L,y);y+=100}
  y+=30;font(500,30,M);x.fillStyle=P.muted;x.fillText('NOTA FINAL',L,y);
  y+=210;font(800,240,D,1);x.fillStyle=P.ink;x.fillText(f(m),L-8,y);
  const I=s.ind,stats=[['PIB',sgn(I.pib)+'%'],['IPCA',f(I.ipca)+'%'],['SELIC',f(I.selic,2)+'%'],['DÍVIDA',f(I.div)+'%'],['DESEMPREGO',f(I.desemp)+'%'],['IBOVESPA',f(I.ibov/1000,0)+' mil']];
  y+=80;const cw=(W-2*L)/3;
  stats.forEach(([l,v],i)=>{const cx=L+(i%3)*cw,cy=y+Math.floor(i/3)*150;font(500,26,M);x.fillStyle=P.muted;x.fillText(l,cx,cy);fit(700,62,D,v,cw-24);x.fillStyle=P.ink;x.fillText(v,cx,cy+68)});
  y+=300;const earned=ACH.filter(a=>a.ok(s,I,!demit)).slice(0,3);
  const room=Math.floor((H-290-(y+62))/58)+1; // cabe quantas linhas antes do rodapé
  if(earned.length&&room>0){font(500,26,M);x.fillStyle=P.muted;x.fillText('CONQUISTAS',L,y);y+=62;x.fillStyle=P.och;for(const a of earned.slice(0,room)){fit(600,44,D,'★  '+a.t,W-2*L);x.fillText('★  '+a.t,L,y);y+=58}}
  fit(700,58,D,'Consegue fazer melhor?',W-2*L);x.fillStyle=P.ink;x.fillText('Consegue fazer melhor?',L,H-170);
  font(400,28,M);x.fillStyle=P.muted;x.fillText(GAME_URL.replace(/^https?:\/\//,''),L,H-115);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  return {blob,url:c.toDataURL('image/png')};
}

  if(a==='sheetclose'){closeSheet();return}
  if(a==='savefile'){offerFile(`mandato-${slug(s.nome)}-${qLabel(Math.min(s.t,15)).replace(/[^\dA-Za-z]+/g,'-').toLowerCase()}.json`,new Blob([JSON.stringify(s)],{type:'application/json'}))
    .then(r=>{if(r==='saved'||r==='downloaded'||r==='shared')toast('Arquivo do mandato salvo.');else if(r==='unavailable'){toast('Aqui não dá para baixar arquivos. Use o código de save.');$('saveDlg').querySelector('[data-act=copycode]')?.click()}});return}
  if(a==='copycode'){const code=saveCode(),out=$('codeOut');copyText(code,out).then(ok=>toast(ok?'Código copiado. Guarde-o para carregar no menu inicial.':'Selecione e copie o código abaixo.'));return}
  if(a==='loadfile'){$('loadFile').click();return}
  if(a==='loadcode'){const o=parseSave($('loadCode').value);if(o)loadGame(o);else $('loadErr').hidden=false;return}
  if(a==='shareig'){haptic('pick');shareInstagram();return}
  if(a==='copytext'){copyText(SHARE?.text||'',$('shareFallback')).then(ok=>toast(ok?'Texto copiado.':'Selecione e copie o texto.'));return}
  if(!s)return;
  if(a==='pick'){s.picks[b.dataset.d]=+b.dataset.o;JUST='d'+b.dataset.d+b.dataset.o;haptic('pick');renderDecide();save()}
  else if(a==='vpick'){s.vpicks[b.dataset.v]=+b.dataset.o;JUST='v'+b.dataset.v+b.dataset.o;haptic('pick');renderDecide();save()}
  else if(a==='ack')ackPush();
  else if(a==='deckyes')swipe('yes');
  else if(a==='deckno')swipe('no');
  else if(a==='deckundo'){s.quick=null;$('quickzone').innerHTML=deckHTML();bindDeck();save()}
  else if(a==='deckreset'){s.deck=shuffle(s.deck);s.deckPos=0;$('quickzone').innerHTML=deckHTML();bindDeck();save()}
  else if(a==='sabopen')openSab();
  else if(a==='sabans'){const sb=s.sab,q=QAID[sb.qs[sb.i]],x=q.a[+b.dataset.a];
    sb.answers[sb.i]={q:q.q(s.ind),k:x.k,t:x.t,r:x.r,ef:x.ef};haptic('answer');renderSab();save();$('sab').querySelector('.tv-react .btn')?.focus()}
  else if(a==='sabnext'){const sb=s.sab;sb.i++;if(sb.i>=sb.qs.length)sb.done=true;renderSab();save();$('sab').querySelector('.tv-opt,.recap+.btn')?.focus()}
  else if(a==='sabclose')closeSab();
  else if(a==='close'){if(b.disabled)return;haptic('close',$('main'));closeQuarter();ANIM=s.phase!=='copom';render();top0()}
  else if(a==='copom'){copomChoose(b.dataset.k);render()}
  else if(a==='copomdone'){copomFinish();ANIM=true;render();top0()}
  else if(a==='next'){if(s.t>=16)s.phase='fim';else startQuarter(s);render();top0()}
  else if(a==='restart'){UI.menu=true;UI.newName=s.nome;render();window.scrollTo({top:0})}
  else if(a==='projstart'){if(!s.proj){s.proj={id:b.dataset.p,prog:0,paused:false,pauses:0,start:s.t};renderDecide();save()}}
  else if(a==='projpay'){if(s.proj){s.proj.paused=false;renderDecide();save()}}
  else if(a==='projpause'){if(s.proj){s.proj.paused=true;renderDecide();save()}}
  else if(a==='projdrop'){
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Confirmar: arquivar e perder o progresso';return}
    s.projCancel[s.proj.id]=s.t;s.proj=null;renderDecide();save()}
  else if(a==='haptics'){hapticsOn=!hapticsOn;try{localStorage.setItem('mf-haptics',hapticsOn?'1':'0')}catch(e){}renderHaptBtn();if(hapticsOn)haptic('pick')}
  else if(a==='reset'){
    UI.menu=true;UI.newName=s.nome;save();render();window.scrollTo({top:0});
  }
});
$('sab').addEventListener('close',onSabClosed);
function start(data){
  state=(data&&data.state)||load()||null;
  if(state&&!state.nome)state.nome='Sem Nome'; // saves anteriores ao menu inicial
  if(data&&data.ui)Object.assign(UI,data.ui);else UI.menu=true; // toda abertura começa pelo menu inicial
  render();
}
window.claude?.hot?.snapshot?.(()=>({state,ui:UI}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
