<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ministro da Fazenda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout (V3, mobile-first): notificações no topo · boletim oficial com gravura de cédula · painel de 8 indicadores + 4 relações · 5 despachos · agenda do gabinete · barra fixa para fechar o trimestre · relatório com repercussão */
:root{
  --bg:#E9EDE8; --surface:#F7F9F5; --ink:#10221C; --muted:#56675F; --line:#C6D0C8; --soft:#DCE4DE;
  --accent:#0B6B5A; --accent-ink:#F2FBF7; --on-color:#FFFFFF; --ochre:#94590B; --good:#25744A; --bad:#B0281F; --plum:#6B3A7A;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1613; --surface:#13201C; --ink:#E4EDE8; --muted:#93A59C; --line:#273A33; --soft:#1B2B26;
  --accent:#3DB397; --accent-ink:#06120E; --on-color:#0C1613; --ochre:#E1A54C; --good:#5CC28A; --bad:#F07A6E; --plum:#C99AD8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1613; --surface:#13201C; --ink:#E4EDE8; --muted:#93A59C; --line:#273A33; --soft:#1B2B26;
  --accent:#3DB397; --accent-ink:#06120E; --on-color:#0C1613; --ochre:#E1A54C; --good:#5CC28A; --bad:#F07A6E; --plum:#C99AD8; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.mast{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
.mast::after{content:"";position:absolute;right:-60px;top:-80px;width:340px;height:340px;pointer-events:none;opacity:.22;
  background:repeating-radial-gradient(circle at 50% 50%,transparent 0 5px,var(--accent) 5px 6px),repeating-radial-gradient(circle at 30% 70%,transparent 0 7px,var(--ochre) 7px 7.6px);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mast h1{margin:4px 0 0;font-family:var(--f-display);font-stretch:66%;font-weight:800;font-size:clamp(34px,6vw,58px);line-height:.92;letter-spacing:-.01em;text-wrap:balance}
.mast h1 em{font-style:normal;color:var(--accent)}
.when{position:relative;z-index:1;text-align:right}
.when b{display:block;font-family:var(--f-display);font-stretch:75%;font-weight:700;font-size:26px;line-height:1}
.when span{font-size:13px;color:var(--muted)}
.timeline{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative;z-index:1}
.yr{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.yr small{grid-column:1/-1;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.q{height:8px;border-radius:2px;background:var(--soft)}
.q.done{background:var(--accent);opacity:.55}
.q.now{background:var(--ochre)}

.grid{display:grid;gap:12px;margin-top:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .lab{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.tile .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{font-family:var(--f-display);font-stretch:72%;font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.d{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.d.up{color:var(--good)} .d.down{color:var(--bad)} .d.flat{color:var(--muted)}
.chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--good)} .chip.warn{color:var(--ochre)} .chip.crit{color:var(--bad)}
svg.spark{display:block;width:96px;height:28px;flex:none}
.approval{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;transition:background .4s,border-color .4s}
/* Estado de perigo: fundo tingido, barra pulsando e um tremor curto ao renderizar */
.ap.danger{background:color-mix(in srgb,var(--bad) 11%,var(--surface));border-color:color-mix(in srgb,var(--bad) 55%,var(--line));animation:shake .45s ease-in-out 1}
.ap.danger .bar i{animation:pulse 1.1s ease-in-out infinite}
.ap.danger .top b::after{content:" · risco de queda";font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--bad);font-weight:500}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
/* Hodômetro e flash de variação */
.odo{display:inline-block;transition:color .3s}
.flash-up{animation:flashUp 1.3s ease-out 1}
.flash-down{animation:flashDown 1.3s ease-out 1}
@keyframes flashUp{0%{background:color-mix(in srgb,var(--good) 35%,transparent);color:var(--good)}100%{background:transparent}}
@keyframes flashDown{0%{background:color-mix(in srgb,var(--bad) 35%,transparent);color:var(--bad)}100%{background:transparent}}
.fade-in{animation:fadeIn .35s ease-out 1}
@keyframes fadeIn{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Dicas dos conselheiros */
.hint{font-size:12.5px;line-height:1.45;color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:8px}
.hint b{font-style:normal;font-weight:600;color:var(--ink);font-size:11.5px}
.risk{font-family:var(--f-mono);font-size:11px;color:var(--ochre)}
.press.chain{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
/* Reformas estruturais */
.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.proj h3{margin:0;font-family:var(--f-display);font-stretch:78%;font-weight:700;font-size:19px;line-height:1.15}
.proj p{margin:0;font-size:13px;color:var(--muted)}
.proj .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.proj .bonus{font-size:12.5px;color:var(--good)}
.proj.done{opacity:.75} .proj.done h3::after{content:" ✓";color:var(--good)}
.proj.off{opacity:.55}
.proj .btn{padding:8px 12px;font-size:13.5px;margin-top:auto;align-self:flex-start}
.active-proj{margin-top:12px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 18px;align-items:center}
.active-proj h3{margin:2px 0 4px;font-family:var(--f-display);font-stretch:78%;font-size:22px}
.active-proj p{margin:0;font-size:13px;color:var(--muted)}
.steps{display:flex;gap:4px;margin-top:10px}
.steps i{flex:1;height:10px;border-radius:2px;background:var(--soft)}
.steps i.on{background:var(--accent)}
.toggle{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toggle .btn{padding:8px 14px;font-size:13.5px}
/* Epílogo e conquistas */
.epi p{max-width:68ch;margin:0 0 12px;font-size:15.5px}
.epi p:first-of-type{font-size:17px;font-weight:500}
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.medal{border:1px solid var(--ochre);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;background:color-mix(in srgb,var(--ochre) 7%,transparent)}
.medal .seal{width:40px;height:40px;border-radius:50%;border:2px solid var(--ochre);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--ochre);font-size:18px;background:repeating-radial-gradient(circle,transparent 0 3px,color-mix(in srgb,var(--ochre) 20%,transparent) 3px 4px)}
.medal b{display:block;font-size:14px} .medal span{font-size:12px;color:var(--muted)}
.medal.locked{border-color:var(--line);background:transparent;opacity:.6} .medal.locked .seal{border-color:var(--line);color:var(--muted);background:none}
@media (prefers-reduced-motion:reduce){.ap.danger,.ap.danger .bar i,.flash-up,.flash-down,.fade-in{animation:none!important}}
.ap .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ap .top b{font-size:12.5px} .ap .top span{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.bar{position:relative;height:8px;border-radius:4px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px;transition:width .5s}
.bar.low i{background:var(--bad)} .bar.mid i{background:var(--ochre)}
.bar::after{content:"";position:absolute;top:0;bottom:0;left:var(--floor,22%);width:1px;background:var(--bad);opacity:.7}
.ap p{margin:4px 0 0;font-size:11.5px;color:var(--muted)}

.sec{margin-top:28px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec h2{margin:0;font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:28px;letter-spacing:-.005em}
.sec p{margin:0;color:var(--muted);font-size:13px;max-width:60ch}
.intro{margin-top:14px;border-left:3px solid var(--ochre);background:var(--surface);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;max-width:78ch}
.intro p{margin:0 0 8px} .intro p:last-of-type{margin:0}
.intro button{margin-top:10px}
.desk{display:grid;gap:14px;margin-top:12px}
.dil{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px}
.dil.picked{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.tagrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.dil .tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre)}
.press{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:color-mix(in srgb,var(--plum) 14%,transparent);color:var(--plum)}
.press.cong{background:color-mix(in srgb,var(--ochre) 14%,transparent);color:var(--ochre)}
.press.rec{background:var(--soft);color:var(--muted)}
.dil h3{margin:4px 0 6px;font-family:var(--f-display);font-stretch:78%;font-weight:700;font-size:21px;line-height:1.15;text-wrap:balance}
.dil .ctx{margin:0;font-size:14px;color:var(--muted);max-width:60ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 10px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt .k{grid-row:1/4;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px}
.opt b{font-weight:600;font-size:14px}
.opt .ds{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.opt[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fx{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-mono);font-size:11px}
.fx .p{color:var(--good)} .fx .n{color:var(--bad)} .fx .r{color:var(--ochre)}

/* Agenda do gabinete */
.agenda{display:grid;gap:12px;margin-top:12px}
.visit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:120px minmax(0,1fr);overflow:hidden}
.visit.picked{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.slot{background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.slot b{font-family:var(--f-display);font-stretch:72%;font-size:24px;line-height:1}
.slot span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vbody{padding:14px 16px;display:grid;gap:10px;min-width:0}
.vbody .who{font-weight:600;font-size:14.5px}
.vbody .who small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.vbody q{display:block;font-family:var(--f-display);font-stretch:85%;font-size:18px;line-height:1.3;quotes:"“" "”"}
.vopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vopt{text-align:left;background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:grid;gap:3px}
.vopt:hover{border-color:var(--accent)}
.vopt .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.vopt b{font-weight:600;font-size:13.5px;line-height:1.3}
.vopt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.vopt[aria-pressed="true"] .lbl{color:var(--accent)}

.quick{margin-top:14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px}
.quick h4{margin:0 0 8px;font-size:13.5px}
.qrow{display:flex;flex-wrap:wrap;gap:8px}
.qb{background:transparent;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px}
.qb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.closebar{position:sticky;bottom:0;margin-top:18px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:flex-end;align-items:center;gap:14px;flex-wrap:wrap}
.closebar span{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:12px 20px;font-weight:600;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

/* Relatório */
.report{margin-top:12px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h4{margin:0 0 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card h4:not(:first-child){margin-top:20px}
.copom{font-family:var(--f-display);font-stretch:80%;font-size:22px;font-weight:600;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.news{display:grid;gap:12px}
.news article{border-top:1px solid var(--line);padding-top:10px}
.news article:first-child{border-top:0;padding-top:0}
.news .h{font-weight:600;font-size:14.5px}
.news .h small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px;color:var(--muted)}
.news .h small.ok{color:var(--good)} .news .h small.bad{color:var(--bad)} .news .h small.ev{color:var(--ochre)} .news .h small.vis{color:var(--plum)}
.news p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt td{padding:6px 0;border-top:1px solid var(--line)}
table.dt tr:first-child td{border-top:0}
table.dt td:not(:first-child){text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}

.buzz{margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.post{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.post:first-of-type{border-top:0;padding-top:0;margin-top:0}
.post .hd{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.post .hd b{font-weight:600}
.post .hd span{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.post p{margin:4px 0 0;font-size:14px}
.post .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:4px}
.col blockquote{margin:0;font-family:var(--f-display);font-stretch:88%;font-size:17px;line-height:1.35}
.col .by{margin-top:6px;font-size:12px;color:var(--muted)}
.col .by b{color:var(--ink);font-weight:600}
.pop .hl{font-family:var(--f-display);font-stretch:68%;font-weight:800;font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.005em}
.pop .src{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--bad);margin-bottom:2px}
.pop p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}

.end{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.end h2{margin:6px 0 8px;font-family:var(--f-display);font-stretch:66%;font-weight:800;font-size:clamp(32px,6vw,52px);line-height:.95;text-wrap:balance}
.end > p{max-width:65ch;margin:0 0 14px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
.grade{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.grade span{font-size:12.5px;color:var(--muted)} .grade b{display:block;font-family:var(--f-display);font-stretch:72%;font-size:30px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px;padding-block:14px 28px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.foot button{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:12px}
.foot-actions{display:flex;gap:16px;flex-wrap:wrap}
.foot button:disabled{text-decoration:none;cursor:default}
.foot button.armed{color:var(--bad);font-weight:600}

@media (max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dil,.report,.buzz{grid-template-columns:minmax(0,1fr)}
  .approval{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .grades{grid-template-columns:repeat(2,minmax(0,1fr))}
  .projects{grid-template-columns:repeat(2,minmax(0,1fr))}
  .medals{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .visit{grid-template-columns:minmax(0,1fr)}
  .slot{flex-direction:row;align-items:baseline;gap:10px;border-right:0;border-bottom:1px solid var(--line);padding:10px 14px}
  .vopts{grid-template-columns:minmax(0,1fr)}
  .projects{grid-template-columns:minmax(0,1fr)}
  .active-proj{grid-template-columns:minmax(0,1fr)}
  .toggle{align-items:flex-start}
}
@media (max-width:420px){
  .mast{grid-template-columns:1fr}
  .when{text-align:left}
  .tile .val{font-size:25px}
  svg.spark{width:70px}
  .timeline{grid-template-columns:repeat(2,1fr)}
  .approval{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===================== V3 · Estilos ===================== */
/* Tokens da transmissão de TV: visual único e escuro de propósito, nos dois temas */
:root{--tv-bg:#0E1416;--tv-panel:#172124;--tv-ink:#EEF3F1;--tv-muted:#9AABA6;--tv-red:#E5483B;--tv-line:#2A3A3D;--ok-soft:color-mix(in srgb,var(--good) 14%,var(--surface));--mid-soft:color-mix(in srgb,var(--ochre) 14%,var(--surface));--bad-soft:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile.wide{grid-column:span 2}}
.tile .lab{flex-wrap:wrap}
.tile .row{flex-wrap:wrap}
.tile .val{white-space:nowrap}
svg.spark{max-width:100%}
.closebar{background:linear-gradient(to top,var(--bg) 82%,transparent)}
.q.cp{position:relative}
.q.cp::after{content:"";position:absolute;left:50%;top:-6px;width:4px;height:4px;border-radius:50%;background:var(--ochre);transform:translateX(-50%)}
.btn{min-height:44px}
.btn.red{background:var(--bad);color:var(--on-color)}
.cpnote{color:var(--ochre);font-weight:600}
.jolt{animation:jolt .32s ease-out 1}
@keyframes jolt{0%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}100%{transform:translateX(0)}}
.opt:active,.vopt:active,.reply:active,.tv-opt:active,.btn:active{transform:scale(.985)}
.just{animation:press .3s ease-out 1}
@keyframes press{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:scale(1)}}

/* Plantão e notificações */
.plantao{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.alert{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:var(--r);padding:10px 12px;min-width:0}
.alert.calm{border-left-color:var(--line)}
.alert.cpa{border-left-color:var(--ochre)}
.push.copomp .app{background:var(--ochre);color:var(--on-color);font-size:20px}
.push.copomp .ph b{color:var(--ochre)}
.cpmid{margin:0 0 6px;font-size:13.5px;color:var(--muted)}
.alert .src{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.alert b{display:block;font-size:14.5px;margin-top:2px}
.alert p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.plantao .empty{margin:0;font-size:13px;color:var(--muted)}
.pushes{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;justify-content:center;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.push{pointer-events:auto;width:min(440px,100%);text-align:left;display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:start;
  background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 12px 32px -12px rgba(0,0,0,.45);
  transform:translateY(calc(-100% - 30px));transition:transform .38s cubic-bezier(.2,.9,.3,1.2),opacity .25s;opacity:0}
.push.in{transform:none;opacity:1}
.push.out{transform:translateY(-120%);opacity:0;transition:transform .25s ease-in,opacity .25s}
.push .app{width:38px;height:38px;border-radius:10px;background:var(--bad);color:var(--on-color);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-stretch:70%;font-size:15px}
.push.calm .app{background:var(--accent);color:var(--accent-ink)}
.pbody{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;min-width:0}
.ph{min-width:0}
.ph time{white-space:nowrap}
.ph{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--muted)}
.ph b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bad)}
.push.calm .ph b{color:var(--accent)}
.ph span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.push strong{font-size:15px;line-height:1.25}
.push .px{font-size:13px;color:var(--muted);line-height:1.4}
.push em{font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:2px}

/* Sabatina: cartão na mesa e transmissão ao vivo */
.onair{margin-top:16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:var(--r);padding:14px 16px}
.onair.done{border-left-color:var(--line)}
.onair h3{margin:0;font-family:var(--f-display);font-stretch:78%;font-size:19px;line-height:1.15}
.onair p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bad);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.1s ease-in-out infinite}
.live.off{color:var(--muted)}
dialog.sab{padding:0;border:0;background:transparent;max-width:none;max-height:none;width:min(720px,100%);color:var(--tv-ink)}
dialog.sab::backdrop{background:rgba(5,10,10,.72)}
.tv{background:var(--tv-bg);border:1px solid var(--tv-line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.tv-top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--tv-line)}
.tv-top .live{color:var(--tv-red);background:color-mix(in srgb,var(--tv-red) 18%,transparent);padding:3px 8px;border-radius:3px}
.tv-where{flex:1;min-width:0;font-size:12.5px;color:var(--tv-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-x{background:none;border:1px solid var(--tv-line);color:var(--tv-ink);border-radius:6px;padding:6px 10px;font-size:12.5px;min-height:36px}
.tv-stage{padding:22px 20px 16px;background:radial-gradient(120% 90% at 20% 0%,#1E2E31 0%,var(--tv-bg) 70%)}
.tv-prog{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tv-muted)}
.tv-q{margin:8px 0 16px;font-family:var(--f-display);font-stretch:82%;font-weight:600;font-size:clamp(21px,4.6vw,28px);line-height:1.2;text-wrap:balance}
.lower3{display:inline-grid;border-left:4px solid var(--tv-red);background:var(--tv-panel);padding:6px 12px}
.lower3 b{font-size:13.5px} .lower3 span{font-size:11.5px;color:var(--tv-muted)}
.tv-ans{padding:16px 20px 18px;display:grid;gap:10px;background:var(--tv-bg)}
.tv-opts{display:grid;gap:8px}
.tv-opt{text-align:left;background:var(--tv-panel);color:var(--tv-ink);border:1px solid var(--tv-line);border-radius:8px;padding:12px 14px;font-size:14.5px;line-height:1.4;min-height:48px}
.tv-opt:hover{border-color:var(--tv-muted)}
.tv-opt:focus-visible,.tv-x:focus-visible{outline:2px solid var(--tv-red);outline-offset:2px}
.tv-react{display:grid;gap:8px;animation:fadeIn .3s ease-out 1}
.tv-react .said{color:var(--tv-ink);margin:0;font-family:var(--f-display);font-stretch:88%;font-size:17px;line-height:1.35}
.tv-react p{margin:0;font-size:13.5px;color:var(--tv-muted)}
.tv-react .fx .p{color:#6FD39A} .tv-react .fx .n{color:#FF8A7E}
.tv-react .btn,.tv-ans>.btn{justify-self:start}
.kind{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;justify-self:start;white-space:nowrap}
.k-ev{background:color-mix(in srgb,#9AABA6 22%,transparent);color:var(--muted)}
.k-sin{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.k-pol{background:color-mix(in srgb,var(--ochre) 18%,transparent);color:var(--ochre)}
.tv .k-ev{color:#C9D4D1} .tv .k-sin{color:#6FD39A} .tv .k-pol{color:#F0B860}
.recap{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.recap li{display:grid;gap:4px;font-size:13.5px;color:var(--tv-muted);border-top:1px solid var(--tv-line);padding-top:8px}
.ticker{overflow:hidden;border-top:1px solid var(--tv-line);background:var(--tv-red);color:#FFFFFF;font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.ticker .tk{display:inline-flex;animation:tick 26s linear infinite;padding:6px 0}
.ticker .tk span{padding-right:0}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Copom: reunião reservada em formato de conversa */
.copom-room{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:760px}
.copom-room header{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}
.copom-room h2{margin:2px 0 4px;font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:28px}
.copom-room header p{margin:0;font-size:13.5px;color:var(--muted)}
.chat{display:grid;gap:10px;padding:16px 0}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.msg p{margin:0;padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.45}
.msg.bc p{background:var(--soft);border-bottom-left-radius:4px}
.msg.me{justify-self:end}
.msg.me p{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.new{animation:msgIn .32s ease-out both;animation-delay:var(--d,0s)}
.replies.new,.verdict.new{animation:msgIn .32s ease-out both;animation-delay:var(--d,0s)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.replies{display:grid;gap:8px}
.reply{text-align:left;background:transparent;border:1px solid var(--accent);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14.5px;min-height:48px}
.reply:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.verdict{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.vline{font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:clamp(34px,7vw,48px);line-height:1}
.verdict p{margin:0;color:var(--muted)}
.verdict .btn{justify-self:start}
.leak{border-radius:var(--r);padding:10px 12px;font-size:13.5px;background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line))}
.leak.safe{background:var(--soft);border-color:var(--line);color:var(--muted)}

/* Avatares e humor */
.av{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink);border:2px solid var(--line);transition:background .3s,color .3s,border-color .3s}
.av svg{width:22px;height:22px}
.av.big{width:52px;height:52px} .av.big svg{width:28px;height:28px}
.av-ok{background:var(--good);border-color:var(--good);color:var(--on-color)}
.av-mid{background:var(--ochre);border-color:var(--ochre);color:var(--on-color)}
.av-bad{background:var(--bad);border-color:var(--bad);color:var(--on-color)}
.av-wary{border-style:dashed;border-color:var(--muted)}
.av.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1) 1}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.visit .who{display:flex;gap:12px;align-items:center}
.visit .who > div{min-width:0}
.visit .who b{display:block;font-size:14.5px}
.visit .who small{display:block;color:var(--muted);font-size:12.5px}
.mood{display:inline-block;margin-top:3px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.mood.m-ok{color:var(--good)} .mood.m-mid{color:var(--ochre)} .mood.m-bad{color:var(--bad)} .mood.m-wary{color:var(--muted)}
.visit{transition:background .3s,border-color .3s}
.visit.m-ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.visit.m-mid{background:var(--mid-soft);border-color:color-mix(in srgb,var(--ochre) 50%,var(--line))}
.visit.m-bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.slot em{font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--plum);margin-top:6px}
.vctx{margin:0;font-size:13.5px;color:var(--muted)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:start}
.vs .side{display:grid;gap:8px;min-width:0}
.vs q{font-size:16px}
.versus{align-self:center;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--muted)}
.vopt.yes[aria-pressed="true"]{border-color:var(--good);background:var(--ok-soft)}
.vopt.yes[aria-pressed="true"] .lbl{color:var(--good)}
.vopt.mid[aria-pressed="true"]{border-color:var(--ochre);background:var(--mid-soft)}
.vopt.mid[aria-pressed="true"] .lbl{color:var(--ochre)}
.vopt.no[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-soft)}
.vopt.no[aria-pressed="true"] .lbl{color:var(--bad)}
.duo .vopt.no[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.duo .vopt.no[aria-pressed="true"] .lbl,.duo .vopt.yes[aria-pressed="true"] .lbl{color:var(--accent)}
.duo .vopt.yes[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}

/* Deck de articulação */
.quickzone{margin-top:6px}
.deck{display:grid;margin:14px auto 0;max-width:420px;padding-bottom:22px}
.qcard{grid-area:1/1;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px;display:grid;gap:8px;align-content:start;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;z-index:calc(3 - var(--i));
  transform:translateY(calc(var(--i) * 11px)) scale(calc(1 - var(--i) * .045));transform-origin:50% 100%;
  box-shadow:0 10px 24px -16px rgba(0,0,0,.35);transition:transform .28s cubic-bezier(.2,.8,.3,1),opacity .28s}
.qcard:not(.top){pointer-events:none}
.qcard:not(.top) > *{opacity:.35}
.qcard.dragging{transition:none;cursor:grabbing}
.qcard.fly{transition:transform .28s ease-in,opacity .28s ease-in;opacity:0}
.qcard:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.qhead{display:flex;justify-content:space-between;align-items:center}
.qcard h3{margin:0;font-family:var(--f-display);font-stretch:78%;font-size:21px;line-height:1.15}
.qcard p{margin:0;font-size:13.5px;color:var(--muted)}
.stamp{position:absolute;top:16px;font-family:var(--f-display);font-weight:800;font-stretch:70%;font-size:20px;letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;border:3px solid;border-radius:6px;pointer-events:none}
.stamp.yes{right:16px;color:var(--good);transform:rotate(8deg);opacity:var(--yes,0)}
.stamp.no{left:16px;color:var(--bad);transform:rotate(-8deg);opacity:var(--no,0)}
.qcard.top{opacity:1}
.deckbtns{display:flex;justify-content:center;align-items:center;gap:18px;font-size:12.5px;color:var(--muted)}
.dbtn{width:54px;height:54px;border-radius:50%;border:2px solid;background:var(--surface);font-size:22px;line-height:1;display:grid;place-items:center}
.dbtn.no{color:var(--bad)} .dbtn.yes{color:var(--good)}
.dbtn:active{transform:scale(.92)}
.qchosen,.qempty{margin-top:12px;max-width:560px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--good) 45%,var(--line));border-radius:14px;padding:14px 16px}
.qchosen b{display:block;font-size:15px} .qchosen p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.qempty{grid-template-columns:minmax(0,1fr) auto;background:var(--surface);border-color:var(--line)}
.qempty p{margin:0;font-size:13.5px;color:var(--muted)}

/* Repercussão */
.combo{margin-top:14px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:18px 20px}
.combo .kick{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.combo h3{margin:4px 0 6px;font-family:var(--f-display);font-stretch:66%;font-weight:800;font-size:clamp(28px,6vw,44px);line-height:.98;text-transform:uppercase;text-wrap:balance}
.combo p{margin:0;max-width:66ch;font-size:14px;color:color-mix(in srgb,var(--bg) 82%,var(--ink))}
.post .bio{font-size:11.5px;color:var(--muted);margin-top:1px}
.post.viral{background:color-mix(in srgb,var(--ochre) 9%,transparent);border-radius:6px;padding:8px 10px;margin-left:-10px;margin-right:-10px}

@media (max-width:600px){
  .plantao{grid-template-columns:minmax(0,1fr)}
  .onair{grid-template-columns:minmax(0,1fr)}
  .onair .btn{justify-self:start}
  .vs{grid-template-columns:minmax(0,1fr)}
  .versus{justify-self:center;font-size:18px}
  dialog.sab{width:100%;height:100%;margin:0}
  dialog.sab .tv{min-height:100%;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tv-stage{flex:1;display:flex;flex-direction:column;justify-content:flex-end}
  .qchosen{grid-template-columns:auto minmax(0,1fr)}
  .qchosen .btn{grid-column:1/-1;justify-self:start}
  .msg{max-width:96%}
  .copom-room{padding:14px}
}
@media (prefers-reduced-motion:reduce){
  .push,.push.in,.push.out,.qcard,.qcard.fly{transition:none}
  .live i,.ticker .tk,.msg.new,.replies.new,.verdict.new,.av.pop,.jolt,.just,.tv-react{animation:none!important}
}

/* Reset base (antes vinha do invólucro de publicação) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* ===================== V4 · Menu, salvamento e compartilhamento ===================== */
.mbar{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1;flex-wrap:wrap}
.mbar .eyebrow{min-width:0}
.tools{display:flex;gap:8px}
.tb{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.tb:hover{border-color:var(--accent)}
.tb svg{width:16px;height:16px}
.mast h1{margin-top:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:70;
  background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:14px;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
dialog.sheet{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(480px,calc(100% - 32px))}
dialog.sheet::backdrop{background:rgba(5,12,10,.55)}
.sheet-in{padding:20px;display:grid;gap:12px}
.sheet-in h2{margin:0;font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:28px}
.sheet-in p{margin:0;font-size:14px;color:var(--muted)}
.sheet-row{display:flex;flex-wrap:wrap;gap:8px}
.sheet-in textarea,.saveio textarea,.share textarea{width:100%;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink);resize:vertical}
.sheet-in .close{justify-self:end}
/* Menu inicial */
.menu{display:grid;gap:18px;padding-top:6px}
.cover{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,5vw,44px) clamp(18px,5vw,44px);display:grid;gap:16px}
.cover::after{content:"";position:absolute;right:-90px;top:-110px;width:440px;height:440px;pointer-events:none;opacity:.24;
  background:repeating-radial-gradient(circle at 50% 50%,transparent 0 5px,var(--accent) 5px 6px),repeating-radial-gradient(circle at 30% 70%,transparent 0 7px,var(--ochre) 7px 7.6px);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.cover > *{position:relative;z-index:1}
.mtitle{margin:0;font-family:var(--f-display);font-stretch:62%;font-weight:800;font-size:clamp(52px,12vw,112px);line-height:.86;letter-spacing:-.01em;text-wrap:balance}
.mtitle em{font-style:normal;color:var(--accent);display:block}
.lede{margin:0;max-width:52ch;font-size:16.5px}
.start{display:grid;gap:8px;max-width:560px}
.start label{font-weight:600;font-size:14px}
.startrow{display:flex;gap:8px;flex-wrap:wrap}
.startrow input{flex:1 1 220px;min-width:0;min-height:48px;font:inherit;font-size:17px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink)}
.startrow input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.startrow .btn{min-height:48px}
.formerr{margin:0;font-size:13px;color:var(--bad)}
.cont{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;max-width:560px}
.cont b{display:block;font-size:16px}
.cont span:not(.eyebrow){font-size:13px;color:var(--muted)}
.brief{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.brief article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.brief h2,.saveio h2{margin:0 0 10px;font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:24px}
.brief p{margin:0 0 10px;font-size:14px}
.how{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px}
.fall{margin:0;padding:0;list-style:none;display:grid;gap:0}
.fall li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.fall li:first-child{border-top:0}
.fall b{color:var(--bad);font-weight:600;text-align:right}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.saveio{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.saveio p{margin:0;font-size:13.5px;color:var(--muted)}
.saveio details{display:grid;gap:8px}
.saveio summary{cursor:pointer;font-size:13.5px;font-weight:600}
.saveio details[open] .btn{margin-top:8px}
/* Compartilhamento */
.share{margin-top:6px}
.share-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.sbtn{display:grid;gap:3px;text-align:left;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:64px;font:inherit}
.sbtn b{font-size:15px} .sbtn span{font-size:12.5px;color:var(--muted)}
.sbtn:hover{border-color:var(--accent)}
.sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.share-body{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;margin-top:14px;align-items:start}
.scard{margin:0}
.scard img{display:block;width:100%;aspect-ratio:9/16;border-radius:12px;border:1px solid var(--line);background:var(--soft);object-fit:cover}
.scard figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.stext{margin:6px 0 10px;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
@media (max-width:900px){.brief{grid-template-columns:minmax(0,1fr)}.share-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.share-body{grid-template-columns:minmax(0,1fr)}.scard{max-width:240px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* Fim de mandato: ações e apoio via PIX */
.end-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pix-btn{transition:border-color .2s,color .2s,background .2s}
.pix-btn.copied{border-color:var(--good);color:var(--good);background:var(--ok-soft)}
.pix-note{margin:10px 0 0;font-size:13px;color:var(--muted);max-width:60ch}
.pix-key{font-family:var(--f-mono);font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink);user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
@media (max-width:600px){.end-actions .btn{flex:1 1 100%}}
</style>

<script>
/* ===================== Utilidades ===================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const f=(v,d=1)=>v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(v,d=1)=>(v>0?'+':v<0?'−':'')+f(Math.abs(v),d);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MESES=['Jan–Mar','Abr–Jun','Jul–Set','Out–Dez'];
const KEY='mf-desafio-save-v4';

const GAME_URL='https://pior-emprego-do-mundo.vercel.app/';
/* Chave PIX para apoio ao projeto (temporária: troque pela chave definitiva antes do lançamento) */
const PIX_KEY='164dec18-770c-4873-96d0-55f221886f74';
/* hash estável: usado para que dicas e variações não mudem a cada re-render */
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}
  h^=h>>>16;h=Math.imul(h,0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);h^=h>>>16; // fmix: espalha os bits finais
  return (h>>>0)/4294967296};
const DSCALE=.55; // peso de cada despacho no trimestre
</script>

   dur: trimestres · custo: gasto político por trimestre · req: relação que, abaixo de 25, cancela */

 {id:'bcAutonomo',t:'Autonomia financeira do BC',d:'Orçamento próprio para o Banco Central e mandato reforçado em lei.',dur:3,custo:{pres:-7,cong:-2},req:'pres',bonus:'Expectativas de inflação ancoradas na meta, mesmo com ruído fiscal.'},
 {id:'previdencia',t:'Reforma da Previdência 2.0',d:'Idade mínima atualizada e novas regras para militares e servidores.',dur:4,custo:{cong:-7,povo:-3,pres:-2},req:'cong',bonus:'Primário +0,4 p.p. e credibilidade +10 de uma vez.'},
 {id:'produtividade',t:'Agenda de Produtividade',d:'Marco das concessões, abertura comercial gradual e licenciamento simplificado.',dur:3,custo:{cong:-5,pres:-3},req:'cong',bonus:'Crescimento potencial +0,4 p.p. permanente.'},
 {id:'eletrico',t:'Reforma do Setor Elétrico',d:'Mercado livre de energia para todos e fim dos subsídios cruzados na conta de luz.',dur:4,custo:{cong:-5,pres:-2},req:'cong',bonus:'IPCA −0,4 p.p. de uma vez e crescimento potencial +0,15 p.p.'},
];
const REQ_LABEL={cong:'Congresso',pres:'Presidente'};
/* bônus aplicados uma única vez na conclusão; os permanentes são lidos no modelo via s.perks */
const PERK_ONCE={administrativa:I=>{I.prim+=.3},previdencia:I=>{I.prim+=.4;I.cred=Math.min(100,I.cred+10)},eletrico:I=>{I.ipca=Math.max(.5,I.ipca-.4)}};

/* Processa o projeto ativo no fim do trimestre. Retorna a notícia para o relatório. */
function tickProject(s){
  const p=s.proj;if(!p)return null;const P=PROJ.find(x=>x.id===p.id),I=s.ind;
  if(I[P.req]<25){s.proj=null;s.projCancel[P.id]=s.t;return {k:'bad',t:`${P.t} cancelada`,x:`Com o apoio do ${REQ_LABEL[P.req]} em ${f(I[P.req],0)}%, a reforma perdeu sustentação e foi arquivada.`}}
  if(p.paused){p.pauses++;if(p.pauses>=2){s.proj=null;s.projCancel[P.id]=s.t;return {k:'bad',t:`${P.t} abandonada`,x:'Dois trimestres sem articulação e a reforma saiu da pauta. O trabalho feito se perdeu.'}}
    return {k:'',t:`${P.t} em pausa`,x:'Sem capital político investido, a reforma não avançou. Mais um trimestre parado e ela será arquivada.'}}
  p.pauses=0;for(const k in P.custo)I[k]=clamp(I[k]+P.custo[k],0,100);p.prog++;
  if(p.prog>=P.dur){s.proj=null;s.projDone.push(P.id);s.perks[P.id]=true;PERK_ONCE[P.id]?.(I);
    return {k:'ok',t:`${P.t} aprovada`,x:`Promulgada depois de ${P.dur} trimestres de negociação. ${P.bonus}`}}
  return {k:'',t:`${P.t}: etapa ${p.prog} de ${P.dur}`,x:pick(['Relator apresenta parecer na comissão especial.','Audiências públicas lotadas e muita negociação de bastidor.','Líderes pedem ajustes no texto em troca dos votos.','A matéria avança, mas cada voto custa caro.'])};
}

const ADV={

 povo:['a comunicação',['tem apelo popular','rende boas manchetes'],['é impopular','vai pegar mal nas ruas'],['deve ser muito popular'],['pode virar uma crise de imagem']],
 ipca:['a Secretaria de Política Econômica',['ajuda a segurar os preços'],['pressiona a inflação'],['derruba a inflação'],['pode acelerar bastante a inflação']],
 pib:['a Secretaria de Política Econômica',['estimula a atividade'],['freia a economia'],['dá um impulso forte ao PIB'],['pode jogar a economia para baixo']],
 desemp:['a Secretaria de Política Econômica',['ajuda o emprego'],['pode custar empregos'],['gera muitas vagas'],['ameaça muitos empregos']],
};
const cap=s=>s[0].toUpperCase()+s.slice(1);
function adviceFor(ef,seed){
  const arr=Object.entries(ef).map(([k,v])=>{const [,g,sc]=FX[k];return {k,v,good:v*g>0,n:Math.abs(v)/sc}}).filter(x=>x.n>=.45).sort((a,b)=>b.n-a.n);
  if(!arr.length)return 'A equipe não vê grandes efeitos, para o bem ou para o mal.';
  const ph=(x,salt)=>{const a=ADV[x.k];const list=x.n>=1.8?(x.good?a[3]:a[4]):(x.good?a[1]:a[2]);return list[Math.floor(hash(seed+salt)*list.length)]};
  const a=arr[0],v1=ADV[a.k][0];let txt=`${cap(v1)} avalia que a medida ${ph(a,'a')}`;
  const b=arr.find(x=>ADV[x.k][0]!==v1);
  if(b){ /* névoa: às vezes a equipe não arrisca prever o segundo efeito */
    if(hash(seed+'fog')<.2)txt+=`. Sobre o resto, ninguém na equipe arrisca uma previsão`;
    else txt+=b.good===a.good?`, e ${ADV[b.k][0]} acrescenta que ${ph(b,'b')}`:`, mas ${ADV[b.k][0]} alerta que ${ph(b,'b')}`;
  }
  return txt+'.';
}

function epilogue(s){
  const I=s.ind,ps=[],demit=s.over?.kind==='demitido',ano=2027+Math.floor((s.t-1)/4);
  // 1. Retrato econômico
  if(I.pib>=2.5&&I.ipca>5.5)ps.push(`O país cresceu ${f(I.pib)}% no último trimestre e o comércio viveu meses de festa. Mas a inflação de ${f(I.ipca)}% corroeu salários e obrigou o Banco Central a segurar os juros. Os livros devem lembrar o período como mais um ciclo populista: euforia no começo, conta no final.`);
  else if(I.prim>=.25&&(I.desemp>=8||I.povo<35))ps.push(`As contas fecharam com superávit de ${f(I.prim)}% do PIB, algo que o Tesouro não via havia uma década. O preço apareceu no mercado de trabalho e nas ruas: desemprego de ${f(I.desemp)}% e aprovação popular de ${f(I.povo,0)}%. Você deixou a Esplanada sob protestos, elogiado nos relatórios dos bancos e vaiado na porta do ministério.`);
  else if(I.pib>=3&&inBand(I.ipca)&&I.prim>=0)ps.push(`Crescimento de ${f(I.pib)}%, inflação de ${f(I.ipca)}% e contas no azul. Economistas de diferentes escolas concordaram, por uma vez, que o país viveu anos raros. Seminários em São Paulo já usam o mandato como estudo de caso.`);
  else if(I.pib<1&&I.ipca>4.5)ps.push(`O mandato terminou com a pior combinação possível: crescimento de ${f(I.pib)}% e inflação de ${f(I.ipca)}%. A palavra estagflação voltou às capas dos jornais, e o próximo ministro herda uma economia sem tração e com preços teimosos.`);
  else if(I.div>=95)ps.push(`A dívida bruta chegou a ${f(I.div)}% do PIB. Cada leilão do Tesouro passou a exigir juros mais altos, e o tema dominou a campanha de ${ano}. A herança fiscal é o assunto que ninguém no novo governo quer enfrentar.`);
  else if(I.prim>=.25&&inBand(I.ipca))ps.push(`Casa arrumada: primário de ${f(I.prim)}% do PIB e inflação de ${f(I.ipca)}%, dentro da meta. O crescimento de ${f(I.pib)}% não empolgou ninguém, mas o sucessor recebe a economia em ordem.`);
  else if(demit)ps.push(`Sua passagem pelo ministério foi curta demais para mudar o rumo do país. Você sai deixando PIB de ${f(I.pib)}%, inflação de ${f(I.ipca)}% e dívida de ${f(I.div)}% do PIB.`);
  else ps.push(`Foi um mandato de travessia. PIB de ${f(I.pib)}%, inflação de ${f(I.ipca)}%, desemprego de ${f(I.desemp)}% e dívida de ${f(I.div)}% do PIB. Nada desabou, nada decolou.`);
  // 2. Política
  if(demit)ps.push(`${s.over.x} A saída aconteceu em ${qDate(s.t-1)}, depois de ${s.t} trimestre${s.t>1?'s':''} no cargo.`);
  else if(I.pres>=70&&I.cong>=50)ps.push('No Planalto e no Congresso, você saiu com prestígio raro. O Presidente fez questão de citar seu nome no discurso de despedida, e líderes de partidos diferentes já sondam seu interesse por uma candidatura.');
  else if(I.pres<35)ps.push(`A relação com o Presidente terminou fria, em ${f(I.pres,0)}%. As últimas reuniões foram protocolares, e a imprensa registrou que você não foi convidado para a cerimônia de transição.`);
  else if(I.cong<30)ps.push(`No Congresso, sua passagem é lembrada pelos atritos. Com apoio de ${f(I.cong,0)}%, as últimas votações da Fazenda dependeram de acordos de última hora.`);
  else ps.push('Com o Presidente e o Congresso, a relação foi de altos e baixos, sem rupturas definitivas.');
  if(s.stats.centrao===0)ps.push('Você atravessou o mandato sem entregar cargos nem emendas ao Centrão, uma façanha que os colunistas de Brasília comentam com uma mistura de admiração e incredulidade.');
  else if(s.stats.centrao>=8)ps.push(`Foram ${s.stats.centrao} concessões ao Centrão ao longo do mandato. A governabilidade teve preço, e ele está registrado nas planilhas de emendas.`);
  // 3. Mercado
  if(I.fl>=55)ps.push(`Na Faria Lima, o saldo é positivo: Selic em ${f(I.selic,2)}%, dólar a R$ ${f(I.cambio,2)} e Ibovespa em ${f(I.ibov,0)} pontos. Gestoras disputam você para o conselho.`);
  else if(I.fl<25)ps.push(`O mercado não sentirá saudade. O dólar terminou a R$ ${f(I.cambio,2)}, a Selic em ${f(I.selic,2)}% e o Ibovespa em ${f(I.ibov,0)} pontos.`);
  else ps.push(`O Ibovespa encerra sua gestão em ${f(I.ibov,0)} pontos, ${I.ibov>=200000?'acima':'abaixo'} dos 200 mil do dia da posse.`);
  if(s.stats.sinceras>=5)ps.push('Nas sabatinas, ficou conhecido pela franqueza. Alguns trechos das entrevistas ainda circulam como exemplo de ministro que responde o que perguntam.');
  else if(s.stats.evasivas>=4)ps.push('Nas sabatinas, virou meme: perguntas diretas, respostas que não respondiam nada. O apelido de "esfinge da Esplanada" pegou.');
  if(s.stats.vazamentos>=2)ps.push(`As conversas com o Banco Central vazaram ${s.stats.vazamentos} vezes. A relação entre Fazenda e BC sai do mandato arranhada.`);
  // 4. Legado
  const done=s.projDone.map(id=>PROJ.find(p=>p.id===id).t);
  ps.push(done.length?`O legado mais duradouro leva sua assinatura: ${done.join(', ').replace(/, ([^,]*)$/,' e $1')}. ${done.length>1?'Essas reformas':'Essa reforma'} vão continuar rendendo nos próximos governos.`:'Nenhuma reforma estrutural levou sua assinatura. A gestão será lembrada pelas decisões do dia a dia.');
  return ps;
}

<script>
/* ===================== Repercussão (V3) =====================
   Redes: personas de nicho reagem às decisões. Imprensa: colunas e manchetes. Combos: manchete do trimestre. */
const COLS=[['Beatriz Lemos','colunista de macroeconomia'],['Otávio Rangel','economista-chefe de gestora'],['Helena Moura','especialista em contas públicas'],['Caio Fontes','repórter de política em Brasília'],['Marina Sá','analista de juros e câmbio']];
const POP=['Telejornal da noite','Portal Fato Já','Rádio Acorda Cidade','Jornal O Povão','Programa Tarde Quente'];

/* Monta o contexto que personas e combos leem */
function buzzCtx(r,I,P){
  const tags={};for(const t of r.tags)tags[t]=(tags[t]||0)+1;
  const sabKinds={ev:0,sin:0,pol:0};for(const a of (r.sab?.answers||[]))sabKinds[a.k]++;
  for(const k in sabKinds)if(sabKinds[k])tags[k]=sabKinds[k];
  if(r.copom?.leaked)tags.vazamento=1;
  return {tags,sabKinds,r,I,P,vis:r.vis,picked:new Set(r.picked),evIds:new Set(r.evIds),
    dS:I.selic-P.selic,dI:I.ipca-P.ipca,dU:I.desemp-P.desemp,dC:(I.cambio/P.cambio-1)*100,ibovPct:(I.ibov/P.ibov-1)*100};
}
function buzz(r,I,P){
  const c=buzzCtx(r,I,P),L=s=>s.toLowerCase();
  /* combo: vazamento tem prioridade; entre os demais, sorteia evitando repetir o do trimestre anterior */
  const hits=COMBOS.filter(x=>x.when(c.tags)),last=typeof state!=='undefined'?state.lastCombo:null;
  const combo=hits.find(x=>x.id==='vazou')||pick(hits.filter(x=>x.id!==last).length?hits.filter(x=>x.id!==last):hits)||null;
  if(typeof state!=='undefined')state.lastCombo=combo?combo.id:null;
  /* --- Redes: pega as 3 personas com reação mais forte (com um pouco de acaso) --- */
  let cand=PERSONAS.map(p=>{const x=p.r(c);return x?{h:p.h,bio:p.bio,w:x[0]+Math.random()*2,t:x[1]}:null}).filter(Boolean);
  cand.sort((a,b)=>b.w-a.w);
  const posts=cand.slice(0,3).map(p=>({h:p.h,bio:p.bio,t:p.t,likes:rnd(.4,48)}));
  if(combo)posts.unshift({h:'@memesdaesplanada',bio:'perfil de memes',t:combo.meme,likes:rnd(40,120),viral:1});
  while(posts.length<3)posts.push({h:'@zapdafamilia',bio:'grupo da família',t:pick(['o ministro parece cansado. eu também tô','economistas no twitter discutindo arcabouço às 2h da manhã','alguém explica pra minha mãe o que é Selic']),likes:rnd(.2,5)});

  /* --- Imprensa especializada --- */
  const ds=r.decis,c1=shuffle(COLS);
  const byCred=ds.slice().sort((a,b)=>Math.abs(b.ef.cred||0)-Math.abs(a.ef.cred||0))[0];
  const byPres=ds.slice().sort((a,b)=>Math.abs(b.ef.pres||0)-Math.abs(a.ef.pres||0))[0];
  const col=[];
  if(combo)col.push({q:combo.col,a:c1[2]});
  if(byCred&&(byCred.ef.cred||0)>0)col.push({q:pick([`Ao optar por "${L(byCred.op)}", a Fazenda envia o sinal que o Copom esperava. Não basta, mas é a direção certa.`,`A decisão de ${L(byCred.op)} mostra um ministro disposto a pagar custo político pela credibilidade.`]),a:c1[0]});
  else if(byCred&&(byCred.ef.cred||0)<0)col.push({q:pick([`"${byCred.op}" é o tipo de decisão que se paga na curva de juros. O mercado não esquece.`,`Com ${L(byCred.op)}, a regra fiscal perde mais um pedaço. A conta chega em juros e câmbio.`]),a:c1[0]});
  if(r.copom?.interactive){const cp=r.copom;
    col.push({q:cp.choice==='press'?`O recado político ao Copom${cp.leaked?', agora público,':''} só torna mais difícil cortar juros. O BC precisa mostrar que não cede.`:cp.choice==='offer'?(cp.won?'A contrapartida fiscal oferecida ao BC funcionou. Agora a Fazenda tem de entregar o que prometeu.':'O BC ouviu a oferta da Fazenda e não se mexeu. Sinal de que a credibilidade fiscal ainda está curta.'):'A Fazenda respeitou o tempo do BC. Em Brasília, isso já é notícia.',a:c1[1]});
  }else if(c.dS!==0)col.push({q:c.dS<0?`O corte do Copom confirma a inflação de ${f(I.ipca)}% mais perto da meta. Com fiscal crível, há espaço para mais.`:`Ao subir a Selic para ${f(I.selic,2)}%, o BC reage a expectativas que pioraram. Parte disso tem endereço em Brasília.`,a:c1[1]});
  if(Math.abs(c.ibovPct)>6)col.push({q:`O Ibovespa ${c.ibovPct>0?'subiu':'caiu'} ${f(Math.abs(c.ibovPct))}% no trimestre e fechou em ${f(I.ibov,0)} pontos. ${c.ibovPct>0?'O investidor voltou a apostar em Brasil.':'O investidor estrangeiro está saindo.'}`,a:COLS[4]});
  if(byPres&&(byPres.ef.pres||0)<-5)col.push({q:`No Planalto, a decisão de "${L(byPres.op)}" caiu mal. A relação entre ministro e Presidente é o termômetro a observar.`,a:COLS[3]});
  const colunas=col.slice(0,2);

  /* --- Imprensa geral --- */
  const pop=[];
  if(c.dI>.15)pop.push({h:pick(['Preços disparam no mercado','Inflação aperta o bolso']),p:`Inflação acumulada chega a ${f(I.ipca)}% e a dona de casa sente no carrinho.`});
  else if(c.dI<-.15)pop.push({h:'Comida fica mais barata',p:`Inflação recua para ${f(I.ipca)}% e o alívio chega às feiras.`});
  if(c.ibovPct<-8)pop.push({h:'Bolsa derrete e investidor perde dinheiro',p:`Ibovespa cai ${f(-c.ibovPct)}% no trimestre.`});
  else if(c.ibovPct>8)pop.push({h:'Bolsa bate recorde',p:`Ibovespa sobe ${f(c.ibovPct)}% e chega a ${f(I.ibov,0)} pontos.`});
  if(c.dU<-.1)pop.push({h:'Mais gente com carteira assinada',p:`Desemprego cai para ${f(I.desemp)}%.`});
  else if(c.dU>.1)pop.push({h:'Desemprego volta a subir',p:`Taxa vai a ${f(I.desemp)}% e filas no Sine aumentam.`});
  if(I.pres-P.pres<-5)pop.push({h:'Clima tenso entre Presidente e ministro',p:'Bastidores falam em reunião fria no Planalto.'});
  else if(I.pres-P.pres>5)pop.push({h:'Presidente elogia ministro em público',p:'Afagos em evento oficial aquecem a relação.'});
  if(pop.length<2)pop.push({h:`Dólar fecha a R$ ${f(I.cambio,2)}`,p:c.dC>0?'Moeda americana sobe e encarece importados.':'Moeda americana recua no trimestre.'});
  const pops=pop.slice(0,2).map(x=>({...x,s:pick(POP)}));
  return {posts:posts.slice(0,3),colunas,pops,combo:combo&&{kick:combo.kick,hl:combo.hl,p:combo.p}};
}
</script>

 {k:'cambio',l:'Dólar',s:'R$ por US$',v:x=>'R$ '+f(x,2),good:-1,d:2},
 {k:'cred',l:'Credibilidade fiscal',s:'curva longa e expectativas',v:x=>f(x,0),good:1,d:0},
 {k:'ibov',l:'Ibovespa',s:'pontos · variação no trimestre',v:x=>f(x,0),good:1,d:0,pct:1},
];
const APROV=[
 {k:'pres',l:'Presidente',n:'Abaixo de 20%, você é trocado.',floor:20},
 {k:'povo',l:'Opinião pública',n:'Abaixo de 22%, o Planalto entrega sua cabeça.',floor:22},
 {k:'fl',l:'Faria Lima',n:'Reage a credibilidade, dívida, dólar e bolsa.',floor:12},
 {k:'cong',l:'Congresso',n:'Abaixo de 18%, você é derrubado.',floor:18},
];
const FX={prim:['Contas',1,.1],cred:['Credib.',1,4],pres:['Presidente',1,4],povo:['Povo',1,3],fl:['Mercado',1,3],cong:['Congresso',1,4],
  ipca:['Inflação',-1,.15],cambio:['Dólar',-1,1.5],pib:['PIB',1,.15],desemp:['Desemprego',-1,.12],div:['Dívida',-1,.3],ibov:['Bolsa',1,3]};
const COPOM_Q=t=>t%4===1||t%4===3; // conversa reservada antes da 2ª reunião do 2º e do 4º trimestre de cada ano
/* O Copom se reúne 8 vezes por ano, a cada ~45 dias: duas reuniões por trimestre (datas ilustrativas) */
const COPOM_CAL=[['28 e 29 de janeiro','17 e 18 de março'],['5 e 6 de maio','16 e 17 de junho'],['28 e 29 de julho','15 e 16 de setembro'],['3 e 4 de novembro','8 e 9 de dezembro']];
const copomDate=(t,n)=>COPOM_CAL[t%4][n];
/* Regra de uma reunião: anda 30% da distância até a taxa-alvo, em passos de 25 pontos-base (no máximo 1 p.p.) */
function copomTarget(s){
  const I=s.ind,credBC=s.perks.bcAutonomo?Math.max(I.cred,75):I.cred;
  const target=I.ipca+5+(55-credBC)*.03+1.2*(I.ipca-3)+.3*(I.pib-2);
  const dS=Math.round(clamp((target-I.selic)*.3,-1,1)/.25)*.25;
  return clamp(I.selic+dS,2,20);
}
/* 1ª reunião do trimestre: decidida no início e entregue como alerta; a Selic muda quando o jogador confirma */
function applyMidCopom(s,q){if(!q||!q.cp||q.cp.applied)return;s.ind.selic=q.cp.to;q.cp.applied=true;s.stats.minSelic=Math.min(s.stats.minSelic,s.ind.selic)}

let state;
function newGame(nome){
  const s={nome:String(nome||'').trim()||'Sem Nome',savedAt:null,t:0,phase:'decidir',intro:false,
    ind:{pib:1.8,ipca:4.8,selic:13.5,prim:-.2,div:82.5,desemp:6.0,cambio:5.4,ibov:200000,cred:45,povo:45,fl:38,cong:52,pres:70},
    ext:{fed:3.75,com:0},flags:{},hist:[],lastUsed:{},evUsed:{},visUsed:{},qaUsed:{},
    cur:FIRST.slice(),vis:[],picks:{},vpicks:{},quick:null,report:null,over:null,
    chains:[],proj:null,projDone:[],projCancel:{},perks:{},
    stats:{centrao:0,cedeuPres:0,recusouPres:0,bandQ:0,minSelic:13.5,maxIbov:200000,sinceras:0,evasivas:0,vazamentos:0,copomDeals:0},
    evq:[],sab:null,lastSab:-9,deck:[],deckPos:0,pend:null,copom:null};
  s.hist.push({...s.ind});startQuarter(s,true);return s;
}
/* Prepara um trimestre: despachos, audiências, alertas, sabatina e o deck de articulação */
function startQuarter(s,first){
  if(!first)s.cur=drawDilemmas(s);
  s.vis=drawVisits(s);s.evq=drawEvents(s);s.sab=drawSabatina(s);
  s.qStart={...s.ind};
  const from=s.ind.selic,to=copomTarget(s);
  s.evq.splice(1,0,{id:'copom1',ack:false,cp:{from,to,date:copomDate(s.t,0),applied:false}});
  s.deck=shuffle(QUICK.map(q=>q.k));s.deckPos=0;s.quick=null;s.picks={};s.vpicks={};
  s.phase='decidir';s.report=null;s.pend=null;s.copom=null;
}
function save(){if(!state)return;try{state.savedAt=stamp();localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}} // salvamento automático a cada ação
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
const avail=(s,id,rep)=>s.lastUsed[id]==null||s.t-s.lastUsed[id]>=(rep??99);

function drawDilemmas(s){
  const out=[];const add=id=>{if(out.length<5&&!out.includes(id))out.push(id)};
  for(const c of s.chains.filter(c=>c.at<=s.t).sort((a,b)=>a.at-b.at)){if(out.length<3)add(c.id)}
  add(SCHEDULE[s.t%4]);
  if(s.t>=13&&avail(s,'bondades',99))add('bondades');
  if(s.ind.cambio>5.9&&avail(s,'cambioCrise',4))add('cambioCrise');
  if(s.flags.seca){add('energia');s.flags.seca=false}
  if(s.flags.enchente){add('enchente');s.flags.enchente=false}
  if(s.flags.petroleo){add('combustivel');s.flags.petroleo=false}
  for(const id of shuffle(POOL))if(avail(s,id,D[id].rep))add(id);
  if(out.length<5)for(const id of shuffle(POOL))if(!(s.cur||[]).includes(id))add(id);
  return out;
}
/* Audiências: duas por trimestre; a partir do 2º trimestre, 40% de chance de uma delas ser uma reunião a dois */
function drawVisits(s){
  const ok=id=>{const u=s.visUsed[id];return u==null||s.t-u>=getV(id).rep};
  const duo=s.t>=1&&Math.random()<.4?shuffle(Object.keys(DUO)).find(ok):null;
  const out=[],need=duo?1:2,ids=shuffle(Object.keys(VIS));
  for(const id of ids){if(out.length>=need)break;if(ok(id))out.push(id)}
  for(const id of ids)if(out.length<need&&!out.includes(id))out.push(id);
  if(duo)out.push(duo);
  return out;
}
/* Eventos do trimestre: um do mundo e um do Brasil, sorteados no início e entregues como alertas */
function pickEvent(s,cat){
  const forced=EV.filter(e=>e.c===cat&&((e.cond&&e.cond(s))||e.at===s.t));
  if(forced.length)return forced[0];
  const pool=EV.filter(e=>e.c===cat&&e.w>0&&(s.evUsed[e.id]==null||s.t-s.evUsed[e.id]>=6));
  let tot=pool.reduce((a,e)=>a+e.w,0),r=Math.random()*tot;
  for(const e of pool){r-=e.w;if(r<=0)return e}
  return pool[0];
}
function drawEvents(s){
  return ['b','m'].map(c=>{const ev=pickEvent(s,c);s.evUsed[ev.id]=s.t;return {id:ev.id,ack:false}});
}
/* Sabatina: agendada a cada três trimestres; coletiva de emergência quando o mercado ou o Planalto azedam */
function drawSabatina(s){
  const I=s.ind;let v=null;
  if(s.t%3===1)v=VENUES[Math.floor(s.t/3)%VENUES.length];
  else if(s.t>0&&s.t-s.lastSab>=2&&(I.fl<25||I.pres<32))v=EMERG;
  if(!v)return null;
  s.lastSab=s.t;
  const okQ=q=>!q.cond||q.cond(I,s),fresh=q=>s.qaUsed[q.id]==null||s.t-s.qaUsed[q.id]>=6;
  const conds=shuffle(QA.filter(q=>q.cond&&okQ(q)&&fresh(q)));
  const rest=shuffle(QA.filter(q=>!q.cond&&fresh(q)));
  const qs=[...conds,...rest].slice(0,v.n).map(q=>q.id);
  qs.forEach(id=>s.qaUsed[id]=s.t);
  return {venue:v,qs,i:0,answers:[],done:false};
}
const QAID=Object.fromEntries(QA.map(q=>[q.id,q]));

/* ---------- Fechamento do trimestre, etapa 1: decisões, eventos e economia real ---------- */
function closeQuarter(){
  const s=state,I=s.ind,E=s.ext;
  for(const q of s.evq)applyMidCopom(s,q); // garante a 1ª reunião mesmo sem toque (simulações, saves antigos)
  const P={...(s.qStart||I)}; // indicadores do início do trimestre
  const e={prim:0,cred:0,pres:0,povo:0,fl:0,cong:0,ipca:0,cambio:0,pib:0,desemp:0,div:0,ibov:0};
  const add=(o,k=1)=>{for(const x in o)e[x]=(e[x]||0)+o[x]*k};
  const decis=[],vis=[],tags=[],picked=[];
  const tag=str=>{if(str)tags.push(...str.split(' '))};
  for(const id of s.cur){
    const dl=D[id],idx=s.picks[id],op=dl.o[idx];let ef;
    if(op.chance){const ok=Math.random()<op.chance(I);ef=ok?op.ok:op.fail;
      decis.push({id,i:idx,tag:dl.tag,t:dl.t,op:op.t,ok,x:ok?op.resOk:op.resFail,ef})}
    else{ef=op.ef;if(op.flag)s.flags[op.flag]=true;decis.push({id,i:idx,tag:dl.tag,t:dl.t,op:op.t,ok:null,x:op.res,ef,chain:!!dl.chain})}
    add(ef,DSCALE*rnd(.6,1.4)); // o efeito real oscila em torno da leitura dos assessores
    s.lastUsed[id]=s.t;s.chains=s.chains.filter(c=>c.id!==id);
    if(op.chain&&!s.chains.some(c=>c.id===op.chain)){const [a,b]=CHAINS[op.chain].in;
      s.chains.push({id:op.chain,at:s.t+a+Math.floor(Math.random()*(b-a+1)),q:qLabel(s.t),op:op.t});decis[decis.length-1].later=true}
    const failed=decis[decis.length-1].ok===false;
    if(!failed)tag(TAGS[id+':'+idx]);picked.push(id+':'+idx+(failed?':fail':'')); // opção derrotada não conta como feita
  }
  for(const id of s.vis){const v=getV(id),i=s.vpicks[id],o=v.o[i];add(o[1],rnd(.7,1.3));s.visUsed[id]=s.t;
    vis.push({id,who:v.duo?`${v.a.who} × ${v.b.who}`:v.who,op:o[0],x:o[2],i,duo:!!v.duo});tag(VTAGS[id+':'+i]);picked.push('v:'+id+':'+i)}
  let quick=null;
  if(s.quick){const q=QUICK.find(q=>q.k===s.quick);quick=q.t;const ef={...q.ef};if(q.k==='bc'&&I.prim<0)ef.cred=1;add(ef);
    if(q.k==='centrao')tag('cedeCentrao');if(q.k==='planalto')tag('cedePres');picked.push('q:'+q.k)}
  let sab=null;
  if(s.sab){sab={venue:s.sab.venue.nome,answers:s.sab.answers.map(a=>({q:a.q,k:a.k,t:a.t}))};
    for(const a of s.sab.answers){add(a.ef);if(a.k==='sin')s.stats.sinceras++;if(a.k==='ev')s.stats.evasivas++}}
  const proj=tickProject(s);
  const mid=s.evq.find(q=>q.cp)?.cp||null;
  const evs=s.evq.filter(q=>!q.cp).map(q=>{const ev=EVID[q.id];ev.a(E,e,s);e.ibov+=IBOV_SHOCK[q.id]||0;return {id:q.id,c:ev.c,t:ev.t,x:ev.x}});
  const st=s.stats;
  for(const t of tags){if(t==='cedeCentrao')st.centrao++;if(t==='cedePres')st.cedeuPres++;if(t==='enfrentaPres')st.recusouPres++}

  /* economia real (perks das reformas entram aqui) */
  const K=s.perks,impulse=-e.prim;
  const drift=-.015+(K.administrativa?.025:0)+(K.previdencia?.015:0);
  I.prim=I.prim+e.prim+.08*(I.pib-2)+drift;
  I.cred=clamp(I.cred+e.cred+3*(I.prim-.1)-.3*Math.max(0,I.div-85),K.marcoFiscal?50:0,100);
  const cPct=e.cambio+.9*(E.fed-3.75)-.06*(I.cred-50)-1.2*E.com+4*(5.4-I.cambio)/5.4+rnd(-2,2)-(K.marcoFiscal?1:0);
  I.cambio=Math.max(3.8,I.cambio*(1+cPct/100));
  const credBC=K.bcAutonomo?Math.max(I.cred,75):I.cred;
  const anchor=3+(55-credBC)*.035,real=I.selic-I.ipca;
  I.ipca=clamp(I.ipca+.3*(anchor-I.ipca)+.1*cPct+.12*(I.pib-2)-.05*(real-5)+e.ipca+rnd(-.15,.15),.5,16);
  const tgt=2.2-.25*(real-5)+.5*impulse+E.com+(I.cred-50)*.01+(K.produtividade?.4:0)+(K.eletrico?.15:0);
  I.pib=clamp(I.pib+.4*(tgt-I.pib)+e.pib+rnd(-.25,.25),-5,7);
  I.desemp=clamp(I.desemp-.15*(I.pib-1.8)+e.desemp,4,16);
  /* inclinação técnica do Copom */
  const base=copomTarget(s); // 2ª reunião do trimestre
  s.pend={e,P,decis,vis,quick,sab,proj,evs,tags,picked,mid};
  if(COPOM_Q(s.t)){s.copom=openCopom(s,base);s.phase='copom'}
  else finishQuarter(base,{base,interactive:false});
}

/* ---------- Copom interativo ----------
   step: 'open' → (respeitar | oferecer | pressionar) · 'offer' → (bloqueio | promessa | desistir) · 'done' */
function openCopom(s,base){
  const I=s.ind,d=base-I.selic,bp=f(Math.abs(d)*100,0);
  const lean=d===0?`manter a Selic em ${f(I.selic,2)}%`:d<0?`cortar a Selic em ${bp} pontos-base, para ${f(base,2)}%`:`subir a Selic em ${bp} pontos-base, para ${f(base,2)}%`;
  const why=I.ipca>4.5?`A inflação de ${f(I.ipca)}% segue acima do teto.`:I.cred<40?'As expectativas não acreditam no fiscal.':(I.ipca<=3.5&&I.cred>=55)?'A inflação converge e o fiscal ajudou.':'As expectativas ainda estão acima da meta.';
  return {step:'open',base,from:I.selic,final:null,choice:null,offer:null,won:false,leaked:false,
    msgs:[{w:'bc',t:`${s.nome}, obrigado por vir. Vou ser direto, como sempre.`},{w:'bc',t:`O comitê está inclinado a ${lean}. ${why}`},{w:'bc',t:'A decisão é do colegiado, mas quero ouvir a Fazenda antes.'}]};
}
const COPOM_OPTS={
 open:[{k:'respect',t:'Respeito o comitê. A decisão é técnica.'},{k:'offer',t:'A Fazenda pode oferecer um sinal fiscal.'},{k:'press',t:'O Presidente quer um corte. E eu também.'}],
 offer:[{k:'block',t:'Um bloqueio extra de R$ 15 bi ainda este mês.'},{k:'promise',t:'Compromisso de meta mais dura no próximo Orçamento.'},{k:'back',t:'Melhor não. Fico com a decisão do comitê.'}],
};
function copomChoose(k){
  const s=state,cp=s.copom,I=s.ind,e=s.pend.e;
  const opt=[...COPOM_OPTS.open,...COPOM_OPTS.offer].find(o=>o.k===k);
  cp.msgs.push({w:'me',t:opt.t});
  if(k==='offer'){cp.step='offer';cp.msgs.push({w:'bc',t:'Estou ouvindo. Que tipo de sinal?'});return}
  let final=cp.base,leakP=0;
  const better=b=>b-.25; // o que uma negociação bem-sucedida rende: 25 pontos-base a menos
  if(k==='respect'||k==='back'){cp.choice='respect';I.cred=clamp(I.cred+2,0,100);e.pres-=cp.base>cp.from?2:1;
    cp.msgs.push({w:'bc',t:'Agradeço. Essa postura ajuda mais do que o senhor imagina.'})}
  else if(k==='block'||k==='promise'){
    cp.choice='offer';cp.offer=k;s.stats.copomDeals++;
    let p=clamp(.25+I.cred/100+(I.ipca<=4.5?.15:-.1)+(k==='block'?.1:-.05),.1,.85);
    if(k==='block'){I.prim+=.12;e.cong-=4;leakP=.3}
    else{I.cred=clamp(I.cred+2,0,100);leakP=.2;s.chains.push({id:'promessaBC',at:s.t+2,q:qLabel(s.t),op:'Compromisso de meta mais dura'})}
    cp.won=Math.random()<p;if(cp.won)final=better(cp.base);
    cp.msgs.push({w:'bc',t:cp.won?'Isso muda a conta. Vou levar ao comitê com o meu apoio.':'Agradeço, mas não é suficiente para mudar o balanço de riscos. Fica registrado.'});
  }else if(k==='press'){
    cp.choice='press';e.pres+=5;I.cred=clamp(I.cred-6,0,100);e.fl-=3;leakP=.5;
    const r=Math.random();
    if(I.ipca<3.5&&I.cred>55&&r<.3){final=better(cp.base);cp.msgs.push({w:'bc',t:'Os dados até permitem algo. Mas não por causa desse recado.'})}
    else if(r<.4){final=cp.base+.25;cp.msgs.push({w:'bc',t:'Ministro, com todo o respeito: depois dessa conversa, o comitê vai precisar mostrar que é independente.'})}
    else cp.msgs.push({w:'bc',t:'Vou fingir que não ouvi isso. A decisão segue técnica.'});
  }
  final=clamp(Math.round(final/.25)*.25,2,20);
  if(leakP&&Math.random()<leakP){cp.leaked=true;s.stats.vazamentos++;
    if(cp.choice==='press'){I.cred=clamp(I.cred-5,0,100);e.fl-=5;e.pres-=2;e.ibov-=2}
    else{I.cred=clamp(I.cred-3,0,100);e.fl-=2;e.cong-=2}}
  cp.final=final;cp.step='done';haptic('copom');
}
function copomFinish(){
  const cp=state.copom;
  finishQuarter(cp.final,{base:cp.base,interactive:true,choice:cp.choice,offer:cp.offer,won:cp.won,leaked:cp.leaked});
}

/* ---------- Fechamento do trimestre, etapa 2: juros, bolsa, dívida e relações ---------- */
function finishQuarter(selic,copom){
  const s=state,I=s.ind,E=s.ext,{e,P}=s.pend,st=s.stats;
  const sA=I.selic;I.selic=selic;const dS=selic-P.selic; // variação do trimestre, somando as duas reuniões
  /* Ibovespa: juros, sinais fiscais, PIB, câmbio, commodities, choques e retorno ao "preço justo" */
  const fair=200000*Math.exp(-.035*(I.selic-13.5))*(1+(I.cred-45)/250)*Math.pow(1.01,s.t+1);
  const ibovPct=clamp(.5-4*dS-5*(selic-copom.base)+.3*e.fl+.12*(I.cred-P.cred)+1.5*(I.pib-P.pib)-.6*(I.cambio/P.cambio-1)*100
    +6*E.com+e.ibov+15*Math.log(fair/I.ibov)+rnd(-5,5),-25,25);
  I.ibov=Math.max(60000,I.ibov*(1+ibovPct/100));
  I.div=clamp(I.div+(-I.prim+I.div*((I.selic*.8-I.ipca)-I.pib)/100)/4+e.div,40,140);
  I.povo=clamp(I.povo+.2*((50-3*(I.ipca-3.5)-2.5*(I.desemp-6.5)+1.5*(I.pib-2))-I.povo)+e.povo,0,100);
  I.fl=clamp(I.fl+.25*((38+.6*(I.cred-45)-6*(I.cambio-5.4)-.3*(I.div-82.5))-I.fl)+e.fl+.12*ibovPct,0,100);
  I.cong=clamp(I.cong+.15*(50-I.cong)-1+.1*(I.povo-45)+e.cong,0,100);
  I.pres=clamp(I.pres+.15*((55+.5*(I.povo-45))-I.pres)+e.pres,0,100);
  E.com*=.6;E.fed=clamp(E.fed+rnd(-.05,.05),2,6);
  if(Math.abs(I.ipca-3)<=.5)st.bandQ++;st.minSelic=Math.min(st.minSelic,I.selic);st.maxIbov=Math.max(st.maxIbov,I.ibov);
  s.hist.push({...I});
  const pd=s.pend;
  s.report={t:s.t,decis:pd.decis,vis:pd.vis,quick:pd.quick,evs:pd.evs,proj:pd.proj,sab:pd.sab,tags:pd.tags,picked:pd.picked,
    evIds:pd.evs.map(x=>x.id),copom:{...copom,a:sA,d:I.selic,mid:pd.mid,date:copomDate(s.t,1)},prev:P};
  s.report.buzz=buzz(s.report,I,P);
  s.t++;s.pend=null;
  s.over=checkOver(s);
  if(!s.over&&s.t>=16)s.over={kind:'fim'};
  s.phase=s.over?.kind==='demitido'?'fim':'relatorio';
  s.picks={};s.vpicks={};s.quick=null;
}
function checkOver(s){
  const I=s.ind;
  if(I.pres<20)return {kind:'demitido',t:'O Presidente pediu seu cargo',x:'Depois de meses de atrito, o Presidente anuncia que vai "renovar a equipe econômica". Você soube pela imprensa.'};
  if(I.povo<22)return {kind:'demitido',t:'Exonerado pela pressão popular',x:'Com a aprovação em colapso, o Planalto troca o comando da economia para tentar salvar o governo.'};
  if(I.cong<18)return {kind:'demitido',t:'Derrubado pelo Congresso',x:'Sem base, você é convocado a três CPIs. O Centrão exige sua saída e o Planalto cede.'};
  if(I.fl<12&&I.cambio>6.8)return {kind:'demitido',t:'Crise de confiança',x:'O dólar dispara, o Tesouro cancela leilões e o mercado deixa de rolar a dívida longa. Você pede demissão.'};
  if(I.ipca>10)return {kind:'demitido',t:'A inflação venceu',x:'O IPCA de dois dígitos derruba o governo nas pesquisas e sua permanência fica insustentável.'};
  return null;
}
</script>

<script>
/* ===================== Render (V3) ===================== */
const $=id=>document.getElementById(id);
const qLabel=t=>`Ano ${Math.floor(t/4)+1} · T${t%4+1}`;
const qDate=t=>`${MESES[t%4]} ${2027+Math.floor(t/4)}`;
const REDUCE=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};

/* ---------- Vibração (com reforço visual onde a API não existe, como no iPhone) ---------- */
const HAPT={pick:15,swipe:30,ack:20,answer:25,copom:[30,50,30],close:[60,40,140],push:[180,90,180],calm:40,danger:[40,60,40,60,40]};
const CAN_VIBRATE=typeof navigator!=='undefined'&&typeof navigator.vibrate==='function';
